<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Itens</title>
    <link rel="stylesheet" href="./style.css">
    <script src=""></script>
</head>
<body class="cadastro-body">
    <header>
        <h1>
            <img src="./static/icons/form.svg" alt="Formulário e lápis">
            Adicionar item
        </h1>
        <nav>
            <a href="./index.html"><button>Fechar</button></a>
        </nav>
    </header>
    <main>
        <section>
            <form id="cadastro-itens">
                <label for="item">Item a cadastrar</label>
                <input type="text" id="item"> <!-- onKeyDown para 'Enter' -->
            </form>
        </section>
        <section id="sugestoes">
            <h2>Sugestões</h2>
            <article> <!-- MDN sugere <div> -->
                <button><img src="./static/icons/plus_symbol.svg" alt="Sinal de Adição">Arroz</button>
                <button><img src="./static/icons/plus_symbol.svg" alt="Sinal de Adição">Feijão</button>
                <button><img src="./static/icons/plus_symbol.svg" alt="Sinal de Adição">Café</button>
                <button><img src="./static/icons/plus_symbol.svg" alt="Sinal de Adição">Macarrão</button>
                <button><img src="./static/icons/plus_symbol.svg" alt="Sinal de Adição">Açúcar</button>
                <button><img src="./static/icons/plus_symbol.svg" alt="Sinal de Adição">Azeite</button>
            </article>
        </section>
    </main>
</body>
</html>
